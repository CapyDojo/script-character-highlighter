                <script>

        

                    // Global error handlers

        

                    const debugErrorDiv = document.getElementById('debug-error');

        

                    window.onerror = function (msg, url, line, col, error) {

        

                        const errorMsg = `Error: ${msg} in ${url} at line ${line}:${col}`;

        

                        debugErrorDiv.textContent += errorMsg + '\n';

        

                        debugErrorDiv.style.display = 'block';

        

                        return false;

        

                    };

        

                    console.error = (function (old) {

        

                        return function (...args) {

        

                            old.apply(console, args);

        

                            const errorMsg = args.map(arg => 

        

                                (typeof arg === 'object' && arg !== null) ? JSON.stringify(arg, null, 2) : arg

        

                            ).join(' ');

        

                            debugErrorDiv.textContent += errorMsg + '\n';

        

                            debugErrorDiv.style.display = 'block';

        

                        };

        

                    })(console.error);

        

            

        

                    // --- SCRIPT PARSING ENGINE V4 ---

        

            

        

                    function normalizeCharacterName(text) {

        

                        // Removes parentheticals like (V.O.) or (CONT'D) from a character name.

        

                        return text.replace(/\s*\([^)]*\)\s*$/g, '').replace(/\s*\(CONT'D\)\s*$/g, '').trim();

        

                    }

        

            

        

                    class ScreenplayParser {

        

                        constructor({ debug = false } = {}) {

        

                            this.debug = debug;

        

                        }

        

            

        

                        log(...args) {

        

                            if (this.debug) {

        

                                console.log('[Parser]', ...args);

        

                            }

        

                        }

        

            

        

                        _getStyleMap(stylesXml) {

        

                            // Reads styles.xml and creates a map of styleId -> {name, indent, isCaps}

        

                            const styleMap = new Map();

        

                            if (!stylesXml) return styleMap;

        

                            const styles = stylesXml.getElementsByTagName('w:style');

        

                            for (const style of styles) {

        

                                if (style.getAttribute('w:type') === 'paragraph') {

        

                                    const styleId = style.getAttribute('w:styleId');

        

                                    const styleNameEl = style.getElementsByTagName('w:name')[0];

        

                                    const styleName = styleNameEl ? styleNameEl.getAttribute('w:val') : '';

        

                                    

        

                                    let indent = 0;

        

                                    const indentEl = style.getElementsByTagName('w:ind')[0];

        

                                    if (indentEl) {

        

                                        indent = parseInt(indentEl.getAttribute('w:left') || '0', 10);

        

                                    }

        

                                    

        

                                    const capsEl = style.getElementsByTagName('w:caps')[0];

        

                                    const isCaps = !!capsEl;

        

            

        

                                    styleMap.set(styleId, { name: styleName, indent, isCaps });

        

                                }

        

                            }

        

                            this.log('Built Style Map with ' + styleMap.size + ' paragraph styles.');

        

                            return styleMap;

        

                        }

        

            

        

                        _getParagraphs(documentXml) {

        

                            // Reads document.xml and returns an array of paragraph objects.

        

                            const paragraphs = [];

        

                            const paraEls = documentXml.getElementsByTagName('w:p');

        

                            for (const paraEl of paraEls) {

        

                                const text = Array.from(paraEl.getElementsByTagName('w:t')).map(t => t.textContent).join('').trim();

        

                                if (!text) continue;

        

            

        

                                let styleId = 'Normal';

        

                                const styleEl = paraEl.getElementsByTagName('w:pStyle')[0];

        

                                if (styleEl) {

        

                                    styleId = styleEl.getAttribute('w:val');

        

                                }

        

                                paragraphs.push({ text, styleId, para: paraEl });

        

                            }

        

                            return paragraphs;

        

                        }

        

            

        

                        parse(documentXml, stylesXml) {

        

                            const styleMap = this._getStyleMap(stylesXml);

        

                            const paragraphs = this._getParagraphs(documentXml);

        

            

        

                            const parasByStyle = new Map();

        

                            for (const p of paragraphs) {

        

                                if (!parasByStyle.has(p.styleId)) {

        

                                    parasByStyle.set(p.styleId, []);

        

                                }

        

                                parasByStyle.get(p.styleId).push(p.text);

        

                            }

        

            

        

                            const styleAnalysis = [];

        

                            for (const [styleId, texts] of parasByStyle.entries()) {

        

                                const style = styleMap.get(styleId);

        

                                if (!style) continue;

        

            

        

                                const avgLen = texts.reduce((acc, t) => acc + t.length, 0) / texts.length;

        

                                const capsRatio = texts.reduce((acc, t) => {

        

                                    const upper = (t.match(/[A-Z]/g) || []).length;

        

                                    const letters = (t.match(/[a-zA-Z]/g) || []).length;

        

                                    return acc + (letters > 1 ? upper / letters : 0);

        

                                }, 0) / texts.length;

        

            

        

                                styleAnalysis.push({ styleId, indent: style.indent, avgLen, capsRatio, isCaps: style.isCaps, count: texts.length });

        

                            }

        

                            

        

                            this.log('Style Analysis:', styleAnalysis);

        

            

        

                            if (styleAnalysis.length < 2) {

        

                                this.log("Not enough styles to analyze. Aborting.");

        

                                return [];

        

                            }

        

            

        

                            const sortedByIndent = styleAnalysis.sort((a, b) => a.indent - b.indent);

        

                            

        

                            const actionStyle = sortedByIndent[0];

        

            

        

                            const charCandidates = sortedByIndent.slice(1).sort((a, b) => {

        

                                const scoreA = (a.capsRatio * 2) - (a.avgLen / 100) + (a.indent / 1000);

        

                                const scoreB = (b.capsRatio * 2) - (b.avgLen / 100) + (b.indent / 1000);

        

                                return scoreB - scoreA;

        

                            });

        

                            const characterStyle = charCandidates[0];

        

            

        

                            const dialogueCandidates = sortedByIndent.filter(s => s.indent > actionStyle.indent && s.indent < characterStyle.indent);

        

                            const dialogueStyle = dialogueCandidates.length > 0 ? dialogueCandidates.sort((a,b) => b.count - a.count)[0] : actionStyle;

        

            

        

                            const elementStyleIds = {

        

                                ACTION: actionStyle.styleId,

        

                                CHARACTER: characterStyle.styleId,

        

                                DIALOGUE: dialogueStyle.styleId,

        

                            };

        

                            this.log('Determined Element Styles:', elementStyleIds);

        

            

        

                            const results = [];

        

                            let currentCharacter = null;

        

                            for (const p of paragraphs) {

        

                                let type = 'ACTION';

        

                                

        

                                if (p.styleId === elementStyleIds.CHARACTER) {

        

                                    type = 'CHARACTER';

        

                                    currentCharacter = normalizeCharacterName(p.text);

        

                                } else if (p.styleId === elementStyleIds.DIALOGUE) {

        

                                    type = 'DIALOGUE';

        

                                } else if (p.text.startsWith('(') && p.text.endsWith(')')) {

        

                                    type = 'PARENTHETICAL';

        

                                }

        

                                

        

                                if (/^(INT\.?\/EXT\.?|INT\.?|EXT\.?|I\/E)\s/.test(p.text) || /\s-\s(DAY|NIGHT|CONTINUOUS)$/.test(p.text)) {

        

                                    type = 'SCENE_HEADING';

        

                                    currentCharacter = null;

        

                                }

        

            

        

                                results.push({

        

                                    type,

        

                                    text: p.text,

        

                                    para: p.para,

        

                                    character: (type === 'DIALOGUE' || type === 'PARENTHETICAL') ? currentCharacter : null

        

                                });

        

                            }

        

                            return results;

        

                        }

        

                    }

        

            

        

                    function runTestHarness() {

        

                        const resultsDiv = document.getElementById('test-results');

        

                        resultsDiv.innerHTML = '<h3>Test Harness Disabled</h3><p>The style-based parser requires a full DOCX file context to run tests.</p>';

        

                        resultsDiv.style.display = 'block';

        

                    }

        

                </script>

        

            <div id="root"></div>

        

            <script type="text/babel">

                const { useState, useRef, useEffect, useMemo } = React;

        

                const COLOR_PALETTE = [

                    { name: 'yellow', value: 'yellow', hex: '#fef08a' },

                    { name: 'green', value: 'green', hex: '#86efac' },

                    { name: 'cyan', value: 'cyan', hex: '#67e8f9' },

                    { name: 'magenta', value: 'magenta', hex: '#f0abfc' },

                    { name: 'lightGray', value: 'lightGray', hex: '#d1d5db' },

                    { name: 'red', value: 'red', hex: '#fca5a5' },

                    { name: 'blue', value: 'blue', hex: '#93c5fd' },

                    { name: 'darkGreen', value: 'darkGreen', hex: '#6ee7b7' },

                    { name: 'darkYellow', value: 'darkYellow', hex: '#fde047' },

                    { name: 'darkRed', value: 'darkRed', hex: '#f87171' },

                    { name: 'darkBlue', value: 'darkBlue', hex: '#60a5fa' },

                    { name: 'darkCyan', value: 'darkCyan', hex: '#22d3ee' },

                ];

        

                function PreviewPanel({ lines, characters, colors, onClose }) {

                    return (

                        <div className="preview-overlay" onClick={onClose}>

                            <div className="preview-panel" onClick={e => e.stopPropagation()}>

                                <div className="preview-header">

                                    <h3>Script Preview</h3>

                                    <button className="preview-close-btn" onClick={onClose}>Close</button>

                                </div>

                                <div className="preview-content">

                                    {lines.map((line, index) => {

                                        const matchedChar = (line.type === 'DIALOGUE' || line.type === 'PARENTHETICAL') 

                                            ? characters.find(c => c.name === line.character) 

                                            : null;

                                        

                                        const style = {};

                                        if (matchedChar) {

                                            const colorHex = colors.find(c => c.value === matchedChar.color)?.hex;

                                            if (colorHex) {

                                                style.backgroundColor = colorHex;

                                            }

                                        }

        

                                        return (

                                            <div key={index} className={`preview-line ${line.type}`}>

                                                {matchedChar 

                                                    ? <span className="highlight" style={style}>{line.text}</span>

                                                    : line.text

                                                }

                                            </div>

                                        );

                                    })}

                                </div>

                            </div>

                        </div>

                    );

                }

        

                function App() {

                    const [file, setFile] = useState(null);

                    const [characters, setCharacters] = useState([]);

                    const [processing, setProcessing] = useState(false);

                    const [status, setStatus] = useState('');

                    const [statusType, setStatusType] = useState('success');

                    const [isDragging, setIsDragging] = useState(false);

                    const [uiMode, setUiMode] = useState('pills');

                    const [searchQuery, setSearchQuery] = useState('');

                    const [colorPickerOpen, setColorPickerOpen] = useState(null);

                    const [parsedLines, setParsedLines] = useState([]);

                    const [isPreviewVisible, setIsPreviewVisible] = useState(false);

                    const fileInputRef = useRef(null);

        

                    useEffect(() => {

                        const savedMode = localStorage.getItem('uiMode');

                        if (savedMode) setUiMode(savedMode);

                    }, []);

        

                    const getSavedColor = (characterName) => localStorage.getItem(`color_${characterName}`) || null;

                    const saveColorPreference = (characterName, color) => localStorage.setItem(`color_${characterName}`, color);

        

                    const setAndSaveUiMode = (mode) => {

                        setUiMode(mode);

                        localStorage.setItem('uiMode', mode);

                    };

        

                                        const parseDocx = async (file) => {

        

                                            setProcessing(true);

        

                                            setStatus('Reading document and analyzing styles...');

        

                                            setStatusType('success');

        

                                            setParsedLines([]);

        

                    

        

                                            try {

        

                                                const arrayBuffer = await file.arrayBuffer();

        

                                                const zip = await JSZip.loadAsync(arrayBuffer);

        

                                                

        

                                                const domParser = new DOMParser();

        

                                                

        

                                                const documentXmlString = await zip.file('word/document.xml').async('string');

        

                                                const documentXml = domParser.parseFromString(documentXmlString, 'text/xml');

        

                                                

        

                                                let stylesXml = null;

        

                                                const stylesFile = zip.file('word/styles.xml');

        

                                                if (stylesFile) {

        

                                                    const stylesXmlString = await stylesFile.async('string');

        

                                                    stylesXml = domParser.parseFromString(stylesXmlString, 'text/xml');

        

                                                }

        

                    

        

                                                const screenplayParser = new ScreenplayParser({ debug: true });

        

                                                const lines = screenplayParser.parse(documentXml, stylesXml);

        

                                                setParsedLines(lines);

        

                    

        

                                                const characterData = new Map();

        

                                                lines.forEach(line => {

        

                                                    if (line.type === 'CHARACTER') {

        

                                                         const charName = normalizeCharacterName(line.text);

        

                                                         if (charName && !characterData.has(charName)) {

        

                                                            characterData.set(charName, { name: charName, lineCount: 0 });

        

                                                        }

        

                                                    } else if (line.type === 'DIALOGUE' && line.character) {

        

                                                        if (characterData.has(line.character)) {

        

                                                            characterData.get(line.character).lineCount++;

        

                                                        }

        

                                                    }

        

                                                });

        

                    

        

                                                const charactersArray = Array.from(characterData.values()).filter(c => c.name).sort((a, b) => a.name.localeCompare(b.name));

        

                                                let colorIndex = 0;

        

                                                const charactersWithColors = charactersArray.map(char => {

        

                                                    const savedColor = getSavedColor(char.name);

        

                                                    const color = savedColor || COLOR_PALETTE[colorIndex % COLOR_PALETTE.length].value;

        

                                                    if (!savedColor) colorIndex++;

        

                                                    return { ...char, color, isSelected: false };

        

                                                });

        

                    

        

                                                setCharacters(charactersWithColors);

        

                                                setStatus(`Found ${charactersWithColors.length} characters.`);

        

                                                setStatusType('success');

        

                                            } catch (error) {

        

                                                console.error(error);

        

                                                setStatus(`Error reading file: ${error.message}`);

        

                                                setStatusType('error');

        

                                            } finally {

        

                                                setProcessing(false);

        

                                            }

        

                                        };

        

                    const processFile = (uploadedFile) => {

                        if (uploadedFile && uploadedFile.name.endsWith('.docx')) {

                            setFile(uploadedFile);

                            setCharacters([]);

                            setSearchQuery('');

                            parseDocx(uploadedFile);

                        } else {

                            setStatus('Please upload a .docx file');

                            setStatusType('error');

                        }

                    };

                    

                    const addHighlightToParagraph = (para, xmlDoc, color) => {

                        const runs = para.getElementsByTagName('w:r');

                        for (let i = 0; i < runs.length; i++) {

                            const run = runs[i];

                            let rPr = run.getElementsByTagName('w:rPr')[0];

                            if (!rPr) {

                                rPr = xmlDoc.createElementNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 'w:rPr');

                                run.insertBefore(rPr, run.firstChild);

                            }

                            const existingHighlight = rPr.getElementsByTagName('w:highlight')[0];

                            if (!existingHighlight) {

                                const highlight = xmlDoc.createElementNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', 'w:highlight');

                                highlight.setAttribute('w:val', color);

                                rPr.appendChild(highlight);

                            }

                        }

                    };

        

                    const highlightCharacters = async () => {

                        if (!file || selectedCharacters.length === 0) {

                            setStatus('Please select at least one character');

                            setStatusType('error');

                            return;

                        }

        

                        setProcessing(true);

                        setStatus('Processing document...');

                        setStatusType('success');

        

                        try {

                            const arrayBuffer = await file.arrayBuffer();

                            const zip = await JSZip.loadAsync(arrayBuffer);

                            const xmlContent = await zip.file('word/document.xml').async('string');

                            const parser = new DOMParser();

                            const xmlDoc = parser.parseFromString(xmlContent, 'text/xml');

        

                            const screenplayParser = new ScreenplayParser();

                            const lines = screenplayParser.parse(xmlDoc);

        

                            let highlightCount = 0;

                            lines.forEach(line => {

                                if ((line.type === 'DIALOGUE' || line.type === 'PARENTHETICAL') && line.character) {

                                    const matchedChar = selectedCharacters.find(c => c.name === line.character);

                                    if (matchedChar) {

                                        addHighlightToParagraph(line.para, xmlDoc, matchedChar.color);

                                        if(line.type === 'DIALOGUE') highlightCount++;

                                    }

                                }

                            });

        

                            const serializer = new XMLSerializer();

                            const modifiedXml = serializer.serializeToString(xmlDoc);

                            zip.file('word/document.xml', modifiedXml);

        

                            const blob = await zip.generateAsync({ type: 'blob' });

                            const url = URL.createObjectURL(blob);

                            const a = document.createElement('a');

                            a.href = url;

                            

                            const charNames = selectedCharacters.map(c => c.name).join('_');

                            const truncatedNames = charNames.length > 50 ? charNames.substring(0, 47) + '...' : charNames;

                            a.download = file.name.replace('.docx', `_${truncatedNames}_highlighted.docx`);

                            

                            document.body.appendChild(a);

                            a.click();

                            document.body.removeChild(a);

                            URL.revokeObjectURL(url);

        

                            setStatus(`✓ Highlighted ${highlightCount} dialogue blocks`);

                            setStatusType('success');

                        } catch (error) {

                            console.error(error);

                            setStatus(`Error processing file: ${error.message}`);

                            setStatusType('error');

                        } finally {

                            setProcessing(false);

                        }

                    };

        

                    const handleFileUpload = (e) => processFile(e.target.files[0]);

                    const handleDragEnter = (e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); };

                    const handleDragLeave = (e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); };

                    const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); };

                    const handleDrop = (e) => {

                        e.preventDefault();

                        e.stopPropagation();

                        setIsDragging(false);

                        processFile(e.dataTransfer.files[0]);

                    };

                    const handleDropzoneClick = () => fileInputRef.current.click();

        

                    const toggleCharacter = (name) => setCharacters(prev => prev.map(c => c.name === name ? { ...c, isSelected: !c.isSelected } : c));

                    const changeCharacterColor = (name, color) => {

                        setCharacters(prev => prev.map(c => c.name === name ? { ...c, color } : c));

                        saveColorPreference(name, color);

                    };

                    const selectAll = () => setCharacters(prev => prev.map(c => ({ ...c, isSelected: true })));

                    const clearAll = () => setCharacters(prev => prev.map(c => ({ ...c, isSelected: false })));

                    const resetColors = () => {

                        characters.forEach(char => localStorage.removeItem(`color_${char.name}`));

                        setCharacters(prev => prev.map((char, index) => ({ ...char, color: COLOR_PALETTE[index % COLOR_PALETTE.length].value })));

                    };

        

                    const filteredCharacters = useMemo(() => searchQuery ? characters.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase())) : characters, [characters, searchQuery]);

                    const selectedCharacters = useMemo(() => characters.filter(c => c.isSelected), [characters]);

                    const colorConflicts = useMemo(() => {

                        const map = new Map();

                        selectedCharacters.forEach(c => {

                            if (!map.has(c.color)) map.set(c.color, []);

                            map.get(c.color).push(c.name);

                        });

                        return Array.from(map.values()).filter(chars => chars.length > 1);

                    }, [selectedCharacters]);

        

                    return (

                        <div className="container">

                            <div className="card">

                                <h1 onClick={runTestHarness}>Script Character Highlighter</h1>

                                <p className="subtitle">Upload a script, select characters, and download a highlighted version.</p>

        

                                <div className="form-group">

                                    <label>Upload Script (.docx)</label>

                                    <div className={`dropzone ${isDragging ? 'drag-over' : ''}`} onDragEnter={handleDragEnter} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} onClick={handleDropzoneClick}>

                                        <div className="dropzone-icon">📄</div>

                                        <div className="dropzone-text"><strong>Click to upload</strong> or drag and drop</div>

                                    </div>

                                    <input ref={fileInputRef} type="file" accept=".docx" onChange={handleFileUpload} />

                                    {file && <div className="file-info">✓ {file.name}</div>}

                                </div>

        

                                {characters.length > 0 && (

                                    <>

                                        <div className="ui-toggle">

                                            <button className={uiMode === 'pills' ? 'active' : ''} onClick={() => setAndSaveUiMode('pills')}>Pills View</button>

                                            <button className={uiMode === 'table' ? 'active' : ''} onClick={() => setAndSaveUiMode('table')}>Table View</button>

                                        </div>

        

                                        <div className="search-actions">

                                            <input type="text" className="search-box" placeholder="Search characters..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />

                                            <button className="action-btn" onClick={selectAll}>Select All</button>

                                            <button className="action-btn" onClick={clearAll}>Clear All</button>

                                            <button className="action-btn" onClick={resetColors}>Reset Colors</button>

                                        </div>

        

                                        {uiMode === 'pills' ? (

                                            <div className="character-pills">

                                                {filteredCharacters.map(char => {

                                                    const colorHex = COLOR_PALETTE.find(c => c.value === char.color)?.hex || '#d1d5db';

                                                    return (

                                                        <div key={char.name} className={`character-pill ${char.isSelected ? 'selected' : ''}`} style={{ color: char.isSelected ? colorHex : 'transparent' }} onClick={() => toggleCharacter(char.name)}>

                                                            <div className="pill-name">{char.name}</div>

                                                            <div className="pill-count">{char.lineCount} lines</div>

                                                            {char.isSelected && <div className="pill-color" style={{ backgroundColor: colorHex }} onClick={(e) => { e.stopPropagation(); setColorPickerOpen(char.name); }} />}

                                                        </div>

                                                    );

                                                })}

                                            </div>

                                        ) : (

                                            <table className="character-table">

                                                <thead>

                                                    <tr>

                                                        <th style={{ width: '40px' }}></th>

                                                        <th>Character</th>

                                                        <th style={{ width: '100px' }}>Lines</th>

                                                        <th style={{ width: '150px' }}>Color</th>

                                                    </tr>

                                                </thead>

                                                <tbody>

                                                    {filteredCharacters.map(char => (

                                                        <tr key={char.name}>

                                                            <td><input type="checkbox" checked={char.isSelected} onChange={() => toggleCharacter(char.name)} /></td>

                                                            <td style={{ fontWeight: 600 }}>{char.name}</td>

                                                            <td>{char.lineCount}</td>

                                                            <td>

                                                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>

                                                                    <span className="color-swatch" style={{ backgroundColor: COLOR_PALETTE.find(c => c.value === char.color)?.hex || '#d1d5db' }} />

                                                                    <select className="color-select" value={char.color} onChange={(e) => changeCharacterColor(char.name, e.target.value)} disabled={!char.isSelected}>

                                                                        {COLOR_PALETTE.map(opt => <option key={opt.value} value={opt.value}>{opt.name}</option>)}

                                                                    </select>

                                                                </div>

                                                            </td>

                                                        </tr>

                                                    ))}

                                                </tbody>

                                            </table>

                                        )}

        

                                        {selectedCharacters.length > 0 && (

                                            <div className="selection-summary">

                                                <span className="summary-text">{selectedCharacters.map(c => c.name).join(', ')}</span>

                                                <span className="summary-badge">{selectedCharacters.length} selected</span>

                                            </div>

                                        )}

        

                                        {colorConflicts.length > 0 && (

                                            <div className="color-warning">

                                                ⚠️ Warning: Multiple characters share the same color: {colorConflicts.map(chars => chars.join(' & ')).join(' | ')}

                                            </div>

                                        )}

                                        

                                        <div style={{display: 'flex', gap: '1rem', marginTop: '1.5rem'}}>

                                            <button className="primary" onClick={() => setIsPreviewVisible(true)} disabled={!file || processing}>

                                                Preview

                                            </button>

                                            <button className="primary" onClick={highlightCharacters} disabled={!file || selectedCharacters.length === 0 || processing}>

                                                {processing ? 'Processing...' : `Download`}

                                            </button>

                                        </div>

                                    </>

                                )}

        

                                {characters.length === 0 && file && !processing &&

                                    <div style={{marginTop: '1.5rem'}}>

                                        <button className="primary" onClick={highlightCharacters} disabled={true}>

                                            Highlight & Download

                                        </button>

                                    </div>

                                }

        

        

                                {status && <div className={`status ${statusType}`}>{status}</div>}

        

                                <div className="instructions">

                                    <h3>How to use:</h3>

                                    <ol>

                                        <li>Upload your script file (.docx format).</li>

                                        <li>The app will analyze the script and list all characters.</li>

                                        <li>Select the characters you want to highlight.</li>

                                        <li>Customize colors using the color dot (Pills view) or dropdown (Table view).</li>

                                        <li>Click "Preview" to see the result, or "Download" to get the file.</li>

                                    </ol>

                                </div>

                            </div>

        

                            {colorPickerOpen && (

                                <>

                                    <div className="color-picker-overlay" onClick={() => setColorPickerOpen(null)} />

                                    <div className="color-picker-popup">

                                        <h3>Choose Color for {colorPickerOpen}</h3>

                                        <div className="color-grid">

                                            {COLOR_PALETTE.map(opt => (

                                                <div key={opt.value} className={`color-option ${characters.find(c => c.name === colorPickerOpen)?.color === opt.value ? 'selected' : ''}`} style={{ backgroundColor: opt.hex }} onClick={() => { changeCharacterColor(colorPickerOpen, opt.value); setColorPickerOpen(null); }} />

                                            ))}

                                        </div>

                                    </div>

                                </>

                            )}

        

                            {isPreviewVisible && (

                                <PreviewPanel 

                                    lines={parsedLines}

                                    characters={selectedCharacters}

                                    colors={COLOR_PALETTE}

                                    onClose={() => setIsPreviewVisible(false)}

                                />

                            )}

                        </div>

                    );

                }

        

                ReactDOM.render(React.createElement(App), document.getElementById('root'));

            </script>

        </body>

        

        </html>
